<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Pro Beta</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --chat-bg: #181818;
            --text-color: #e0e0e0;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
            --border-color: #333;
            --msg-mine-bg: #007bff;
            --msg-theirs-bg: #2a2a2a;
            --input-bg: #252525;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- Sidebar Styles --- */
        #sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #sidebar h2 { margin-top: 0; font-weight: 600; font-size: 1.2rem; }
        #sidebar h3 { font-size: 0.9rem; color: #888; margin-top: 20px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

        input, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        #my-id-display {
            font-size: 0.8rem;
            color: #aaa;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            margin-top: auto; /* Притискає до низу */
        }

        /* --- Chat Area Styles --- */
        #chat-area {
            flex-grow: 1;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #chat-header {
            padding: 15px 25px;
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Стилізація скроллбару */
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background-color: #333; border-radius: 3px; }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message .sender {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .mine {
            background-color: var(--msg-mine-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: white;
        }
        .mine .sender { color: #d0e8ff; }

        .theirs {
            background-color: var(--msg-theirs-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .theirs .sender { color: var(--accent-color); }

        /* --- Input Area Styles --- */
        #input-area {
            padding: 20px 25px;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #msg-text {
            margin-bottom: 0;
            flex-grow: 1;
            border-radius: 20px; /* Круглі поля */
            padding-left: 20px;
        }

        #send-btn {
            width: auto;
            margin-bottom: 0;
            border-radius: 20px;
            padding: 10px 25px;
        }

    </style>
</head>
<body>

<div id="sidebar">
    <h2>Messenger Pro</h2>
    
    <h3>Auth</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="register()">Register / Login</button>
    
    <h3>New Chat</h3>
    <input type="text" id="target-id" placeholder="Paste Recipient ID">
    <button onclick="createChat()" style="background-color: #28a745;">Open Chat</button>

    <div id="my-id-display">
        <b>My ID:</b> <br>
        <span id="my-id">Not logged in</span>
    </div>
</div>

<div id="chat-area">
    <div id="chat-header">
        <span id="chat-title">Select or create a chat to start</span>
    </div>
    
    <div id="messages">
        </div>
    
    <div id="input-area">
        <input type="text" id="msg-text" placeholder="Write a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let myId = null;
    let currentChatId = null;

    // Авто-фокус на полі введення імені при завантаженні
    document.getElementById('username').focus();

    async function register() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if (!username || !password) return alert("Enter Username and Password!");
        
        const res = await fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.id) {
            myId = data.id;
            document.getElementById('my-id').innerText = myId;
            document.getElementById('username').disabled = true;
            document.getElementById('password').disabled = true;
            alert('Registered as: ' + username);
            console.log("Logged in as:", myId);
        } else { alert(data.error || "Login failed"); }
    }

    async function createChat() {
        const targetId = document.getElementById('target-id').value;
        if (!myId) return alert("You need to login first!");
        if (!targetId) return alert("Paste the Recipient's ID!");
        
        const res = await fetch('/conversations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({participants: [myId, targetId]})
        });
        const data = await res.json();
        currentChatId = data.conversation_id;
        document.getElementById('chat-title').innerText = 'Chat with ' + targetId.substring(0, 8) + '...';
        loadMessages();
        document.getElementById('msg-text').focus();
    }

    async function sendMessage() {
        const textInput = document.getElementById('msg-text');
        const text = textInput.value;
        if (!currentChatId || !text.trim()) return;
        
        await fetch('/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({conversation_id: currentChatId, sender_id: myId, text})
        });
        textInput.value = '';
        loadMessages();
    }

    async function loadMessages() {
        if (!currentChatId) return;
        try {
            const res = await fetch(`/conversations/${currentChatId}/messages`);
            const msgs = await res.json();
            const container = document.getElementById('messages');
            
            // Оновлюємо відображення імені та тексту
            container.innerHTML = msgs.map(m => `
                <div class="message ${m.sender_id === myId ? 'mine' : 'theirs'}">
                    <div class="sender">${m.sender_name}</div>
                    ${m.text}
                </div>
            `).join('');
            
            container.scrollTop = container.scrollHeight;
        } catch (e) { console.error("Update error:", e); }
    }

    // Оновлення кожні 2 секунди
    setInterval(loadMessages, 2000);
</script>

</body>
</html>
